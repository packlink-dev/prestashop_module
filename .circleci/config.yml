---
version: 2.1

orbs:
  slack: circleci/slack@3.4.2
  gcp-cli: circleci/gcp-cli@4.0.1

executors:
  deployer:
    docker:
      - image: circleci/php:7.4.2
        auth:
          username: $DOCKERHUB_USERNAME
          password: $DOCKERHUB_TOKEN

jobs:
  build_publish:
    executor: deployer
    working_directory: ~/prestashop
    steps:
      - checkout
      - gcp-cli/setup
      - run:
          name: Build Package
          command: sh packlink-build.sh ${CIRCLE_TAG}
      - run:
          name: Publish package to production cdn
          command: |
            gcloud storage cp artifact.zip gs://${PROD_CDN_URL}/modules/prestashop/statics/latest.zip
            gcloud storage objects update --add-acl-grant=entity=allUsers,role=READER gs://${PROD_CDN_URL}/modules/prestashop/statics/latest.zip
            gcloud storage cp artifact.zip gs://${PROD_CDN_URL}/modules/prestashop/statics/${CIRCLE_TAG}.zip
            gcloud storage objects update --add-acl-grant=entity=allUsers,role=READER gs://${PROD_CDN_URL}/modules/prestashop/statics/${CIRCLE_TAG}.zip
      - slack/notify:
          color: '#00FF00'
          channel: '${SLACK_CHANNEL}'
          message: 'A new version has been released: ${CIRCLE_TAG}'
          webhook: '${SLACK_WEBHOOK}'
      - slack/notify:
          color: '#00FF00'
          channel: '${SLACK_CHANNEL_RELEASES}'
          message: 'A new version has been released: ${CIRCLE_TAG}'
          webhook: '${SLACK_WEBHOOK}'

workflows:
  version: 2.1
  prestashop_module: 
    jobs:
      - build_publish:
          context:
            - packlink-dockerhub
            - packlink-cdn-publish
            - packlink-github
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /.*/
